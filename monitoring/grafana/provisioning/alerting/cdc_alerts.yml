apiVersion: 1

groups:
  - orgId: 1
    name: CDC Pipeline Alerts
    folder: CDC Alerts
    interval: 1m
    rules:

      # Alert 1: Lag cao (warning >= 100 records)
      - uid: cdc-lag-warning
        title: "CDC Lag Warning (>= 100 records)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "cdc_lag_total"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "CDC lag {{ $values.A.Value }} records — Spark có thể chậm"
          description: "Pipeline lag vượt 100 records. Kiểm tra Spark Master UI: http://localhost:8080"
        labels:
          severity: warning
        isPaused: false

      # Alert 2: Lag nghiêm trọng (critical >= 500 records)
      - uid: cdc-lag-critical
        title: "CDC Lag Critical (>= 500 records)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "cdc_lag_total"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [500]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "CDC lag nghiêm trọng: {{ $values.A.Value }} records"
          description: "Pipeline lag vượt 500 records — Spark job cần kiểm tra ngay. http://localhost:8080"
        labels:
          severity: critical
        isPaused: false

      # Alert 3: Spark batch quá chậm (>= 5000ms)
      - uid: cdc-spark-slow
        title: "Spark Batch Slow (>= 5000ms)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "cdc_spark_batch_duration_ms"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [5000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Spark batch duration {{ $values.A.Value }}ms — vượt trigger interval 5s"
          description: "Spark xử lý micro-batch lâu hơn 5 giây, pipeline có thể bị tắc nghẽn."
        labels:
          severity: warning
        isPaused: false
